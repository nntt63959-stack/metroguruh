<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Metrologiya — Guruh Testi</title>
    <style>
        :root {
            --bg-color: #0f111a;
            --card-bg: #161925;
            --input-bg: #1f2336;
            --border-color: #2e344d;
            --accent-color: #5d75f5;
            --accent-hover: #4a62e3;
            --text-main: #f1f3f9;
            --text-muted: #7e87a6;
            --success: #2ec4b6;
            --danger: #e63946;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
            display: none;
        }

        .container.active {
            display: block;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 24px;
        }

        .btn-mode {
            width: 100%;
            padding: 16px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            color: var(--text-main);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 12px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-main);
            font-size: 16px;
            outline: none;
        }

        .btn-primary {
            width: 100%;
            padding: 16px;
            background: var(--accent-color);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .waiting-list {
            list-style: none;
            margin: 15px 0;
        }

        .waiting-list li {
            background: var(--input-bg);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div id="screen-mode" class="container active">
        <h2>Metrologiya Test Tizimi</h2>
        <button class="btn-mode" onclick="changeScreen('screen-admin-auth')">🔑 Admin Panel</button>
        <button class="btn-mode" onclick="changeScreen('screen-student-join')">👨‍🎓 O'quvchi Sifatida Kirish</button>
    </div>

    <div id="screen-admin-auth" class="container">
        <h2>Admin Haqiqiyligi</h2>
        <div class="form-group">
            <label>Admin Paroli</label>
            <input type="password" id="admin-pass" placeholder="Parolni kiriting">
        </div>
        <button class="btn-primary" onclick="verifyAdmin()">Kirish</button>
        <button class="btn-mode" style="margin-top:10px;" onclick="changeScreen('screen-mode')">← Orqaga</button>
    </div>

    <div id="screen-admin-setup" class="container">
        <h2>Test Sozlamalari</h2>
        <div class="form-group">
            <label>O'quvchilar uchun kalit so'z</label>
            <input type="text" id="session-key" value="012">
        </div>
        <div class="form-group">
            <label>Savol guruhi</label>
            <select id="question-group">
                <option value="g1">1-guruh: 1–30-savollar</option>
            </select>
        </div>
        <div class="form-group">
            <label>Har savolga vaqt (soniya)</label>
            <input type="number" id="time-limit" value="60">
        </div>
        <div class="form-group">
            <label>Maksimal o'quvchilar soni</label>
            <input type="number" id="max-players" value="20">
        </div>
        <button class="btn-primary" onclick="createSessionLocal()">✅ Sessiya yaratish</button>
        <button class="btn-mode" style="margin-top:10px;" onclick="changeScreen('screen-mode')">← Orqaga</button>
    </div>

    <div id="screen-admin-waiting" class="container">
        <h2>Kutish Zali</h2>
        <p style="text-align:center; color:var(--text-muted); margin-bottom: 15px;" id="wait-key-display">Kalit so'z: -</p>
        <ul id="admin-player-list" class="waiting-list">
            <li>👨‍🎓 Sardorbek (Tayyor)</li>
            <li>👨‍🎓 Madina (Tayyor)</li>
            <li>👨‍🎓 Shaxzod (Tayyor)</li>
        </ul>
        <button class="btn-primary" onclick="alert('Test guruh uchun muvaffaqiyatli boshlandi!')">🚀 Test
