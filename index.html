<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metrologiya — Sinxron Test</title>
    <style>
        :root { --bg: #0f111a; --card: #161925; --accent: #5d75f5; --text: #f1f3f9; --gray: #7e87a6; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { width: 100%; max-width: 440px; background: var(--card); border-radius: 24px; padding: 24px; display: none; }
        .container.active { display: block; }
        .btn-primary { width: 100%; padding: 16px; background: var(--accent); border: none; border-radius: 14px; color: white; font-weight: 700; cursor: pointer; }
        .live-bar { display: flex; gap: 8px; margin-top: 15px; overflow-x: auto; padding: 10px; background: #1f2336; border-radius: 12px; }
        .student-chip { padding: 6px 12px; background: #2e344d; border-radius: 20px; font-size: 12px; }
        .option-btn { width: 100%; padding: 14px; background: #1f2336; border: 1px solid #2e344d; border-radius: 12px; color: white; margin-bottom: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div id="s-home" class="container active">
    <h2>Metrologiya Test</h2>
    <button class="btn-primary" onclick="changeScreen('s-admin-auth')">🔑 Admin Panel</button>
    <button class="btn-primary" style="margin-top:10px; background:#2e344d;" onclick="changeScreen('s-student-join')">👨‍🎓 O'quvchi Kirish</button>
</div>

<div id="s-admin-auth" class="container">
    <h2>Admin Paroli</h2>
    <input type="password" id="admin-pass" style="width:100%; padding:14px; background:#1f2336; border-radius:14px; border:none; color:white; margin-bottom:10px;">
    <button class="btn-primary" onclick="verifyAdmin()">Kirish</button>
</div>

<div id="s-admin-panel" class="container">
    <h2>Boshqaruv</h2>
    <div id="admin-controls">
        <button class="btn-primary" onclick="adminNext()">Keyingi Savol ▶</button>
    </div>
    <div class="live-bar" id="live-bar-admin"></div>
</div>

<div id="s-student-join" class="container">
    <h2>Ismingizni kiriting</h2>
    <input type="text" id="stu-name" style="width:100%; padding:14px; background:#1f2336; border-radius:14px; border:none; color:white; margin-bottom:10px;">
    <button class="btn-primary" onclick="joinStudent()">Qo'shilish</button>
</div>

<div id="s-quiz" class="container">
    <h3 id="q-text">Savol yuklanmoqda...</h3>
    <div id="q-options"></div>
    <div class="live-bar" id="live-bar-stu"></div>
</div>

<script>
let state = {
    step: 'wait', // wait, start, q1, q2
    players: [],
    myStatus: '⏳'
};

function changeScreen(id) {
    document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

function verifyAdmin() {
    if(document.getElementById('admin-pass').value === 'metro777') changeScreen('s-admin-panel');
    else alert('Xato!');
}

function joinStudent() {
    let name = document.getElementById('stu-name').value;
    state.players.push({name: name, status: '⏳'});
    changeScreen('s-quiz');
    updateUI();
}

function adminNext() {
    // Sinxron holat o'zgarishi
    alert('Keyingi savolga o\'tildi!');
    updateUI();
}

function updateUI() {
    // Jonli panelni yangilash
    const bar = document.getElementById('live-bar-admin');
    bar.innerHTML = state.players.map(p => `<div class="student-chip">${p.name} ${p.status}</div>`).join('');
}

// Har 1.5 soniyada holatni yangilash (Sinxronizatsiya simulyatsiyasi)
setInterval(updateUI, 1500);

</script>
</body>
</html>
