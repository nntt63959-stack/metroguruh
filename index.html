<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metrologiya — Guruh Testi</title>
    <style>
        :root { --bg-color: #0f111a; --card-bg: #161925; --accent-color: #5d75f5; --text-main: #f1f3f9; }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { width: 100%; max-width: 440px; background: var(--card-bg); border-radius: 24px; padding: 32px; display: none; }
        .container.active { display: block; }
        h2 { text-align: center; margin-bottom: 24px; }
        .btn-mode, .btn-primary { width: 100%; padding: 16px; border-radius: 16px; border: none; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 12px; }
        .btn-mode { background: #1f2336; color: white; }
        .btn-primary { background: var(--accent-color); color: white; }
        input { width: 100%; padding: 14px; background: #1f2336; border: 1px solid #2e344d; border-radius: 14px; color: white; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div id="screen-mode" class="container active">
        <h2>Metrologiya Test Tizimi</h2>
        <button class="btn-mode" onclick="changeScreen('screen-admin-auth')">🔑 Admin Panel</button>
        <button class="btn-mode" onclick="changeScreen('screen-student-join')">👨‍🎓 O'quvchi Sifatida Kirish</button>
    </div>

    <div id="screen-admin-auth" class="container">
        <h2>Admin Paroli</h2>
        <input type="password" id="admin-pass" placeholder="Parolni kiriting">
        <button class="btn-primary" onclick="verifyAdmin()">Kirish</button>
        <button class="btn-mode" onclick="changeScreen('screen-mode')">← Orqaga</button>
    </div>

    <div id="screen-admin-setup" class="container">
        <h2>Test Sozlamalari</h2>
        <input type="text" id="session-key" value="012">
        <button class="btn-primary" onclick="changeScreen('screen-admin-waiting')">✅ Sessiya yaratish</button>
    </div>

    <div id="screen-admin-waiting" class="container">
        <h2>Kutish Zali</h2>
        <p style="text-align:center; color:#7e87a6;">O'quvchilar qo'shilishini kuting...</p>
        <button class="btn-primary" onclick="startQuizNow()">🚀 Testni Boshlash</button>
    </div>

    <div id="screen-student-join" class="container">
        <h2>Testga Qo'shilish</h2>
        <input type="text" id="student-name" placeholder="Ism-familiya">
        <input type="text" id="student-key" placeholder="Kalit so'z">
        <button class="btn-primary" onclick="changeScreen('screen-student-waiting')">Guruhga Qo'shilish</button>
        <button class="btn-mode" onclick="changeScreen('screen-mode')">← Orqaga</button>
    </div>

    <div id="screen-student-waiting" class="container">
        <h2>Kutish rejimi...</h2>
    </div>

    <div id="screen-quiz" class="container">
        <h2>Test boshlandi!</h2>
        <p style="text-align:center;">Savollarni yuklamoqdaman...</p>
    </div>

<script>
function changeScreen(targetId) {
    document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
    document.getElementById(targetId).classList.add('active');
}

function verifyAdmin() {
    if(document.getElementById('admin-pass').value === 'metro777') changeScreen('screen-admin-setup');
    else alert('Xato parol!');
}

function startQuizNow() {
    // BU QISM MUHIM: Tugmani bosganda test sahifasiga o'tish
    changeScreen('screen-quiz');
}
</script>
</body>
</html>
